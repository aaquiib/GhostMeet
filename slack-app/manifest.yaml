display_information:
  name: AI Meeting Ghost
  description: Notifies you on Slack when a Google Meet call needs your decision, with a drafted answer to approve, edit, or override.
  background_color: "#6c5ce7"

oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      # slack_notifier.py resolves an email-based slack_target to a
      # user ID via users.lookupByEmail before DMing them.
      - users:read.email

settings:
  interactivity:
    is_enabled: true
    # Placeholder — replace with the real ngrok URL once ngrok is
    # running. slack_webhook.py's /slack/interaction endpoint (Phase 4)
    # is what this should point at.
    request_url: https://<ngrok-url>/slack/interaction
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
