# Single-node local OpenSearch for development (Phase 5, P1). The
# only place Docker is used in this project — everything else runs
# directly (see README). Security plugin disabled for local-dev
# simplicity: no TLS/auth needed, matching OPENSEARCH_HOST=http://localhost:9200
# with no user/password in .env.
services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: ghost-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  opensearch-data:
