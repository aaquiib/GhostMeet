<!DOCTYPE html>
<!-- Side panel UI. Minimal for this phase: a one-time identity setup
     screen (gates Start until filled in), a Start/Stop control, a
     plain-text status area (the seed of the "Ghost is listening"
     consent indicator — Phase 6 styles this properly), and a manual
     speaker-override input. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Meeting Ghost</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      button {
        font-size: 14px;
        padding: 8px 16px;
        cursor: pointer;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 13px;
      }
      input[type='text'] {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px;
        font-size: 14px;
      }
      #setup-save-btn {
        margin-top: 16px;
      }
      #setup-error {
        margin-top: 8px;
        color: #b00020;
        font-size: 13px;
      }
      #status-text {
        margin-top: 16px;
        white-space: pre-wrap;
      }
      #speaker-override {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #ccc;
      }
      #speaker-override h3 {
        font-size: 14px;
        margin-bottom: 4px;
      }
      #speaker-override .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      #speaker-override input {
        flex: 1;
        margin-top: 0;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="setup-screen">
      <h2>Set up Ghost</h2>
      <label>
        Your name
        <input id="setup-name" type="text" placeholder="e.g. Aman" />
      </label>
      <label>
        Other name variants (comma-separated, optional)
        <input id="setup-name-variants" type="text" placeholder="e.g. Aman Kumar" />
      </label>
      <label>
        Your Slack user ID or email
        <input id="setup-slack-target" type="text" placeholder="e.g. aman@example.com" />
      </label>
      <button id="setup-save-btn">Save &amp; Continue</button>
      <div id="setup-error" class="hidden"></div>
    </div>

    <div id="main-screen" class="hidden">
      <button id="start-btn">Start listening</button>
      <button id="stop-btn" class="hidden">Stop Ghost</button>
      <div id="status-text">Ghost is idle.</div>

      <div id="speaker-override">
        <h3>Speaker override</h3>
        <div class="row">
          <input id="override-label" type="text" placeholder="e.g. spk_0" />
          <input id="override-name" type="text" placeholder="e.g. Priya" />
          <button id="override-apply-btn">Apply</button>
        </div>
      </div>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
